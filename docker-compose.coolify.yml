# Set the referenced variables in Coolify, then route the app domain to port 8080.
# This stack runs the official image; it does not build PHP changes from the fork.
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: librebooking
      MARIADB_USER: lb_user
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in Coolify}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: librebooking/librebooking:7.0.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    configs:
      - source: public-url-redirect
        target: /etc/apache2/conf-enabled/public-url-redirect.conf
    environment:
      LB_DATABASE_HOSTSPEC: db
      LB_DATABASE_NAME: librebooking
      LB_DATABASE_USER: lb_user
      LB_DATABASE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify}
      LB_INSTALL_PASSWORD: ${LB_INSTALL_PASSWORD:-}
      LB_SCRIPT_URL: ${LB_SCRIPT_URL:?Set the public URL ending in /Web}
      LB_DEFAULT_TIMEZONE: ${LB_DEFAULT_TIMEZONE:-Asia/Dubai}
      LB_LOGGING_LEVEL: error
      LB_UPLOADS_RESERVATION_ATTACHMENT_PATH: Web/uploads/reservation
      LB_EMAIL_ENABLED: ${LB_EMAIL_ENABLED:-false}
      LB_PHPMAILER_MAILER: smtp
      LB_PHPMAILER_SMTP_HOST: ${SMTP_HOST:-}
      LB_PHPMAILER_SMTP_PORT: ${SMTP_PORT:-587}
      LB_PHPMAILER_SMTP_SECURE: ${SMTP_SECURE:-tls}
      LB_PHPMAILER_SMTP_USERNAME: ${SMTP_USERNAME:-}
      LB_PHPMAILER_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      LB_EMAIL_DEFAULT_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-no-reply@example.com}
    volumes:
      - configuration:/config
      - uploads:/var/www/html/Web/uploads

  scheduler:
    image: librebooking/librebooking:7.0.0
    restart: unless-stopped
    command: ["supercronic", "/config/lb-jobs-cron"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      LB_DATABASE_HOSTSPEC: db
      LB_DATABASE_NAME: librebooking
      LB_DATABASE_USER: lb_user
      LB_DATABASE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify}
      LB_INSTALL_PASSWORD: ${LB_INSTALL_PASSWORD:-}
      LB_SCRIPT_URL: ${LB_SCRIPT_URL:?Set the public URL ending in /Web}
      LB_DEFAULT_TIMEZONE: ${LB_DEFAULT_TIMEZONE:-Asia/Dubai}
      LB_LOGGING_LEVEL: error
      LB_UPLOADS_RESERVATION_ATTACHMENT_PATH: Web/uploads/reservation
      LB_EMAIL_ENABLED: ${LB_EMAIL_ENABLED:-false}
      LB_PHPMAILER_MAILER: smtp
      LB_PHPMAILER_SMTP_HOST: ${SMTP_HOST:-}
      LB_PHPMAILER_SMTP_PORT: ${SMTP_PORT:-587}
      LB_PHPMAILER_SMTP_SECURE: ${SMTP_SECURE:-tls}
      LB_PHPMAILER_SMTP_USERNAME: ${SMTP_USERNAME:-}
      LB_PHPMAILER_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      LB_EMAIL_DEFAULT_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-no-reply@example.com}
    volumes:
      - configuration:/config
      - uploads:/var/www/html/Web/uploads

configs:
  public-url-redirect:
    content: |
      RedirectMatch 302 "^/$" "${LB_SCRIPT_URL:?Set the public URL ending in /Web}/"

volumes:
  database:
  configuration:
  uploads:
